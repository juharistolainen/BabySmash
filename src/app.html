<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BabySmash</title>
    <script>
      // Apply saved theme before first paint so the SPA doesn't flash the default look.
      // Mirrors applyPreferences() in src/lib/preferences.ts.
      (function () {
        var p = {};
        try {
          p = JSON.parse(localStorage.getItem("babysmash-preferences") || "{}") || {};
        } catch (e) {}
        var dark =
          p.mode === "dark" ||
          (p.mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = p.theme || "default";
        document.documentElement.dataset.mode = dark ? "dark" : "light";
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
