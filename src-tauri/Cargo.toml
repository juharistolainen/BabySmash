[package]
name = "babysmash"
version = "0.1.0"
description = "BabySmash — keyboard smash play for babies"
authors = ["BabySmash"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "babysmash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-prevent-default = { version = "6", features = ["platform-windows"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# macOS Baby Lock: AppKit presentation options (Phase 1+) and CGEventTap FFI (Phase 2+).
# No App Sandbox — active filter taps are not reliable when sandboxed.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSApplication"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
